<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LabChat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="screen">

        <div class="login-box">

            <h1>LabChat</h1>

            <p>Enter your username to continue</p>

            <form id="loginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>


    <!-- IMAGE SCREEN -->
    <div id="imageScreen" class="image-screen hidden">

        <img
            id="displayImage"
            src=""
            alt="LabChat Image"
        >

    </div>


    <script src="script.js"></script>

</body>
</html>
